<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1f6f3f; }
    .label { font-size: 12px; fill: #1c1c1c; }
    .small { font-size: 11px; fill: #555; }
    .branch { stroke: #1f6f3f; stroke-width: 2; fill: none; }
    .node { fill: #b1530a; }
    .trait-label { font-size: 10px; fill: #b1530a; font-weight: 600; }
    .legend-box { fill: #fdfbf3; stroke: #aaa; }
    .species { font-size: 11px; font-weight: 700; fill: #14492c; }
  </style>
  <text x="380" y="26" text-anchor="middle" class="title">How to Read a Cladogram</text>
  <text x="380" y="45" text-anchor="middle" class="small">Each branch point (node) = a common ancestor. Species closer together share more recent ancestors.</text>

  <!-- Cladogram structure -->
  <!-- root -->
  <line x1="50" y1="320" x2="200" y2="320" class="branch"/>
  <line x1="200" y1="320" x2="240" y2="280" class="branch"/>
  <line x1="200" y1="320" x2="240" y2="360" class="branch"/>
  <!-- 1st branch (shark) -->
  <text x="260" y="365" class="species">Shark</text>
  <text x="260" y="378" class="small">(no legs, no amniotic egg)</text>

  <!-- 2nd node, splits -->
  <line x1="240" y1="280" x2="350" y2="280" class="branch"/>
  <line x1="350" y1="280" x2="380" y2="245" class="branch"/>
  <line x1="350" y1="280" x2="380" y2="315" class="branch"/>
  <text x="400" y="320" class="species">Frog</text>
  <text x="400" y="333" class="small">(legs, no amniotic egg)</text>

  <!-- 3rd node, splits  -->
  <line x1="380" y1="245" x2="470" y2="245" class="branch"/>
  <line x1="470" y1="245" x2="500" y2="210" class="branch"/>
  <line x1="470" y1="245" x2="500" y2="280" class="branch"/>
  <text x="520" y="285" class="species">Lizard</text>
  <text x="520" y="298" class="small">(legs, amniotic egg, no fur)</text>

  <!-- 4th node, splits -->
  <line x1="500" y1="210" x2="580" y2="210" class="branch"/>
  <line x1="580" y1="210" x2="620" y2="175" class="branch"/>
  <line x1="580" y1="210" x2="620" y2="245" class="branch"/>
  <text x="640" y="250" class="species">Mouse</text>
  <text x="640" y="263" class="small">(fur, milk)</text>
  <text x="640" y="180" class="species">Human</text>
  <text x="640" y="193" class="small">(fur, milk, bipedal)</text>

  <!-- node circles -->
  <circle cx="200" cy="320" r="5" class="node"/>
  <circle cx="350" cy="280" r="5" class="node"/>
  <circle cx="470" cy="245" r="5" class="node"/>
  <circle cx="580" cy="210" r="5" class="node"/>

  <!-- trait labels at branch points -->
  <text x="270" y="270" class="trait-label">→ legs</text>
  <text x="400" y="235" class="trait-label">→ amniotic egg</text>
  <text x="510" y="200" class="trait-label">→ fur/milk</text>

  <!-- HOW TO READ -->
  <rect x="40" y="340" width="370" height="65" rx="6" class="legend-box"/>
  <text x="50" y="360" class="label" font-weight="700">How to read it:</text>
  <text x="50" y="378" class="small">• To find how related two species are, trace down to their</text>
  <text x="50" y="392" class="small">  MOST RECENT COMMON ANCESTOR (the closest shared node).</text>

  <rect x="430" y="340" width="310" height="65" rx="6" class="legend-box"/>
  <text x="440" y="360" class="label" font-weight="700">Example:</text>
  <text x="440" y="378" class="small">Lizard + Human share a more recent ancestor (3rd node)</text>
  <text x="440" y="392" class="small">than Lizard + Frog → Lizard is MORE related to Human.</text>
</svg>
