<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <style>
    .label { font-size: 14px; fill: #1c1c1c; }
    .title { font-size: 18px; font-weight: 700; fill: #1f6f3f; }
    .step { font-size: 12px; fill: #2a4d7a; font-style: italic; }
    .box { stroke: #1f6f3f; stroke-width: 2; fill: #d4ead7; }
    .arrow { stroke: #444; stroke-width: 2.5; fill: none; }
    .loc { font-size: 11px; fill: #888; }
  </style>
  <text x="360" y="28" text-anchor="middle" class="title">Central Dogma of Biology</text>

  <!-- DNA -->
  <rect x="40" y="80" width="140" height="80" rx="10" class="box"/>
  <text x="110" y="115" text-anchor="middle" class="label" font-weight="700">DNA</text>
  <text x="110" y="135" text-anchor="middle" class="label" font-size="11">double helix</text>
  <text x="110" y="170" text-anchor="middle" class="loc">in nucleus</text>

  <!-- arrow 1 -->
  <line x1="180" y1="120" x2="280" y2="120" class="arrow" marker-end="url(#arr)"/>
  <text x="230" y="105" text-anchor="middle" class="step">transcription</text>
  <text x="230" y="140" text-anchor="middle" class="loc">RNA polymerase</text>

  <!-- mRNA -->
  <rect x="290" y="80" width="140" height="80" rx="10" class="box"/>
  <text x="360" y="115" text-anchor="middle" class="label" font-weight="700">mRNA</text>
  <text x="360" y="135" text-anchor="middle" class="label" font-size="11">single strand</text>
  <text x="360" y="170" text-anchor="middle" class="loc">nucleus → cytoplasm</text>

  <!-- arrow 2 -->
  <line x1="430" y1="120" x2="530" y2="120" class="arrow" marker-end="url(#arr)"/>
  <text x="480" y="105" text-anchor="middle" class="step">translation</text>
  <text x="480" y="140" text-anchor="middle" class="loc">at ribosome</text>

  <!-- Protein -->
  <rect x="540" y="80" width="140" height="80" rx="10" class="box"/>
  <text x="610" y="115" text-anchor="middle" class="label" font-weight="700">Protein</text>
  <text x="610" y="135" text-anchor="middle" class="label" font-size="11">amino acid chain</text>
  <text x="610" y="170" text-anchor="middle" class="loc">in cytoplasm</text>

  <!-- legend -->
  <text x="360" y="220" text-anchor="middle" class="label">Codon (3 bases on mRNA) = 1 amino acid</text>
  <text x="360" y="245" text-anchor="middle" class="label">Start: AUG (Met) · Stops: UAA, UAG, UGA</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#444"/>
    </marker>
  </defs>
</svg>
