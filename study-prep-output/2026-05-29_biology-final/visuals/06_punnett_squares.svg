<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1f6f3f; }
    .subtitle { font-size: 14px; font-weight: 700; fill: #2a4d7a; }
    .label { font-size: 12px; fill: #1c1c1c; }
    .small { font-size: 11px; fill: #555; }
    .cell-purple { fill: #d2bef0; }
    .cell-white { fill: #fefefe; }
    .cell-pink { fill: #fbd9d4; }
    .cell-red { fill: #c44a3f; }
    .cell-grid { stroke: #444; stroke-width: 1.2; }
    .header-cell { fill: #d4ead7; stroke: #444; stroke-width: 1.2; font-weight: 700; }
  </style>
  <text x="360" y="26" text-anchor="middle" class="title">Punnett Square Examples</text>

  <!-- ============== MONOHYBRID ============== -->
  <text x="120" y="70" class="subtitle">1. Monohybrid: Pp × Pp (Mendel)</text>
  <text x="120" y="88" class="small">P = purple (dominant), p = white (recessive)</text>

  <g transform="translate(80, 100)">
    <!-- Top headers -->
    <rect x="60" y="0" width="60" height="30" class="header-cell"/>
    <text x="90" y="20" text-anchor="middle" class="label">P</text>
    <rect x="120" y="0" width="60" height="30" class="header-cell"/>
    <text x="150" y="20" text-anchor="middle" class="label">p</text>
    <!-- Left headers -->
    <rect x="0" y="30" width="60" height="60" class="header-cell"/>
    <text x="30" y="65" text-anchor="middle" class="label">P</text>
    <rect x="0" y="90" width="60" height="60" class="header-cell"/>
    <text x="30" y="125" text-anchor="middle" class="label">p</text>
    <!-- Squares -->
    <rect x="60" y="30" width="60" height="60" class="cell-purple cell-grid"/>
    <text x="90" y="65" text-anchor="middle" class="label">PP</text>
    <rect x="120" y="30" width="60" height="60" class="cell-purple cell-grid"/>
    <text x="150" y="65" text-anchor="middle" class="label">Pp</text>
    <rect x="60" y="90" width="60" height="60" class="cell-purple cell-grid"/>
    <text x="90" y="125" text-anchor="middle" class="label">Pp</text>
    <rect x="120" y="90" width="60" height="60" class="cell-white cell-grid"/>
    <text x="150" y="125" text-anchor="middle" class="label">pp</text>
  </g>

  <text x="80" y="270" class="label" font-weight="700">Genotype: 1 PP : 2 Pp : 1 pp</text>
  <text x="80" y="288" class="label" font-weight="700">Phenotype: 3 purple : 1 white (3:1)</text>

  <!-- ============== INCOMPLETE DOMINANCE ============== -->
  <text x="480" y="70" class="subtitle">2. Incomplete Dom: RW × RW</text>
  <text x="480" y="88" class="small">Snapdragons: R red + W white = pink heterozygote</text>

  <g transform="translate(440, 100)">
    <rect x="60" y="0" width="60" height="30" class="header-cell"/>
    <text x="90" y="20" text-anchor="middle" class="label">R</text>
    <rect x="120" y="0" width="60" height="30" class="header-cell"/>
    <text x="150" y="20" text-anchor="middle" class="label">W</text>
    <rect x="0" y="30" width="60" height="60" class="header-cell"/>
    <text x="30" y="65" text-anchor="middle" class="label">R</text>
    <rect x="0" y="90" width="60" height="60" class="header-cell"/>
    <text x="30" y="125" text-anchor="middle" class="label">W</text>

    <rect x="60" y="30" width="60" height="60" class="cell-red cell-grid"/>
    <text x="90" y="65" text-anchor="middle" class="label" fill="white">RR</text>
    <text x="90" y="80" text-anchor="middle" class="small" fill="white">red</text>
    <rect x="120" y="30" width="60" height="60" class="cell-pink cell-grid"/>
    <text x="150" y="65" text-anchor="middle" class="label">RW</text>
    <text x="150" y="80" text-anchor="middle" class="small">pink</text>
    <rect x="60" y="90" width="60" height="60" class="cell-pink cell-grid"/>
    <text x="90" y="125" text-anchor="middle" class="label">RW</text>
    <text x="90" y="140" text-anchor="middle" class="small">pink</text>
    <rect x="120" y="90" width="60" height="60" class="cell-white cell-grid"/>
    <text x="150" y="125" text-anchor="middle" class="label">WW</text>
    <text x="150" y="140" text-anchor="middle" class="small">white</text>
  </g>

  <text x="440" y="270" class="label" font-weight="700">1 red : 2 pink : 1 white (1:2:1)</text>
  <text x="440" y="288" class="small">3 phenotypes because heterozygote is BLENDED</text>

  <!-- ============== DIHYBRID ============== -->
  <text x="200" y="320" class="subtitle">3. Dihybrid: TtYy × TtYy (classic 9:3:3:1)</text>
  <text x="200" y="338" class="small">T = tall, t = short · Y = yellow, y = green</text>

  <g transform="translate(80, 350)" font-size="10">
    <!-- Top headers (4 gametes) -->
    <rect x="40" y="0" width="40" height="20" class="header-cell"/>
    <text x="60" y="14" text-anchor="middle">TY</text>
    <rect x="80" y="0" width="40" height="20" class="header-cell"/>
    <text x="100" y="14" text-anchor="middle">Ty</text>
    <rect x="120" y="0" width="40" height="20" class="header-cell"/>
    <text x="140" y="14" text-anchor="middle">tY</text>
    <rect x="160" y="0" width="40" height="20" class="header-cell"/>
    <text x="180" y="14" text-anchor="middle">ty</text>

    <!-- Left headers -->
    <rect x="0" y="20" width="40" height="20" class="header-cell"/><text x="20" y="34" text-anchor="middle">TY</text>
    <rect x="0" y="40" width="40" height="20" class="header-cell"/><text x="20" y="54" text-anchor="middle">Ty</text>
    <rect x="0" y="60" width="40" height="20" class="header-cell"/><text x="20" y="74" text-anchor="middle">tY</text>
    <rect x="0" y="80" width="40" height="20" class="header-cell"/><text x="20" y="94" text-anchor="middle">ty</text>

    <!-- Body cells -->
    <!-- Row 1 -->
    <rect x="40" y="20" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="60" y="34" text-anchor="middle">TTYY</text>
    <rect x="80" y="20" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="100" y="34" text-anchor="middle">TTYy</text>
    <rect x="120" y="20" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="140" y="34" text-anchor="middle">TtYY</text>
    <rect x="160" y="20" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="180" y="34" text-anchor="middle">TtYy</text>
    <!-- Row 2 -->
    <rect x="40" y="40" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="60" y="54" text-anchor="middle">TTYy</text>
    <rect x="80" y="40" width="40" height="20" class="cell-grid" fill="#f0e8d4"/><text x="100" y="54" text-anchor="middle">TTyy</text>
    <rect x="120" y="40" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="140" y="54" text-anchor="middle">TtYy</text>
    <rect x="160" y="40" width="40" height="20" class="cell-grid" fill="#f0e8d4"/><text x="180" y="54" text-anchor="middle">Ttyy</text>
    <!-- Row 3 -->
    <rect x="40" y="60" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="60" y="74" text-anchor="middle">TtYY</text>
    <rect x="80" y="60" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="100" y="74" text-anchor="middle">TtYy</text>
    <rect x="120" y="60" width="40" height="20" class="cell-grid" fill="#e8e0c4"/><text x="140" y="74" text-anchor="middle">ttYY</text>
    <rect x="160" y="60" width="40" height="20" class="cell-grid" fill="#e8e0c4"/><text x="180" y="74" text-anchor="middle">ttYy</text>
    <!-- Row 4 -->
    <rect x="40" y="80" width="40" height="20" class="cell-grid" fill="#d4f0d4"/><text x="60" y="94" text-anchor="middle">TtYy</text>
    <rect x="80" y="80" width="40" height="20" class="cell-grid" fill="#f0e8d4"/><text x="100" y="94" text-anchor="middle">Ttyy</text>
    <rect x="120" y="80" width="40" height="20" class="cell-grid" fill="#e8e0c4"/><text x="140" y="94" text-anchor="middle">ttYy</text>
    <rect x="160" y="80" width="40" height="20" class="cell-grid" fill="#a89878"/><text x="180" y="94" text-anchor="middle" fill="white">ttyy</text>
  </g>

  <!-- Legend for dihybrid -->
  <g transform="translate(320, 360)" font-size="11">
    <rect x="0" y="0" width="14" height="14" fill="#d4f0d4" stroke="#666"/>
    <text x="20" y="11" class="label">9 tall yellow (T_Y_)</text>
    <rect x="0" y="22" width="14" height="14" fill="#f0e8d4" stroke="#666"/>
    <text x="20" y="33" class="label">3 tall green (T_yy)</text>
    <rect x="0" y="44" width="14" height="14" fill="#e8e0c4" stroke="#666"/>
    <text x="20" y="55" class="label">3 short yellow (ttY_)</text>
    <rect x="0" y="66" width="14" height="14" fill="#a89878" stroke="#666"/>
    <text x="20" y="77" class="label">1 short green (ttyy)</text>
  </g>

  <text x="500" y="395" class="label" font-weight="700">Memorize: 9:3:3:1</text>
  <text x="500" y="413" class="small">Always = result of heterozygous</text>
  <text x="500" y="427" class="small">× heterozygous dihybrid</text>
</svg>
