<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1f6f3f; }
    .phase-title { font-size: 12px; font-weight: 700; fill: #1f6f3f; }
    .label { font-size: 11px; fill: #1c1c1c; }
    .note { font-size: 10px; fill: #b1530a; font-style: italic; }
    .cell { fill: #fefcf8; stroke: #444; stroke-width: 1.5; }
    .chrom-mom { fill: none; stroke: #c44a3f; stroke-width: 2.5; }
    .chrom-dad { fill: none; stroke: #5680b3; stroke-width: 2.5; }
    .arrow { stroke: #999; stroke-width: 2; fill: none; }
    .stage-bg { fill: #f6f1e3; stroke: #aaa; stroke-width: 1; stroke-dasharray: 4,3; }
  </style>
  <text x="360" y="26" text-anchor="middle" class="title">Meiosis — One diploid cell → Four haploid gametes</text>

  <defs>
    <marker id="m-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#999"/>
    </marker>
  </defs>

  <!-- MEIOSIS I label -->
  <rect x="20" y="50" width="680" height="190" rx="10" class="stage-bg"/>
  <text x="40" y="70" class="phase-title">MEIOSIS I — Homologous pairs separate (halves chromosome #)</text>

  <!-- Prophase I -->
  <g transform="translate(40, 100)">
    <circle cx="50" cy="60" r="48" class="cell"/>
    <!-- tetrad: 2 red Xs crossed with 2 blue Xs -->
    <path d="M 30,45 L 70,75 M 30,75 L 70,45" class="chrom-mom"/>
    <path d="M 35,50 L 65,70 M 35,70 L 65,50" class="chrom-dad"/>
    <text x="50" y="135" text-anchor="middle" class="phase-title">Prophase I</text>
    <text x="50" y="150" text-anchor="middle" class="label">Tetrads form</text>
    <text x="50" y="165" text-anchor="middle" class="note">⚡ CROSSING OVER</text>
  </g>

  <line x1="145" y1="160" x2="180" y2="160" class="arrow" marker-end="url(#m-arr)"/>

  <!-- Metaphase I -->
  <g transform="translate(190, 100)">
    <circle cx="50" cy="60" r="48" class="cell"/>
    <line x1="50" y1="20" x2="50" y2="100" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M 35,40 L 65,40" class="chrom-mom"/>
    <path d="M 35,80 L 65,80" class="chrom-dad"/>
    <text x="50" y="135" text-anchor="middle" class="phase-title">Metaphase I</text>
    <text x="50" y="150" text-anchor="middle" class="label">Tetrads at midline</text>
    <text x="50" y="165" text-anchor="middle" class="note">⚡ INDEPENDENT ASSORTMENT</text>
  </g>

  <line x1="295" y1="160" x2="330" y2="160" class="arrow" marker-end="url(#m-arr)"/>

  <!-- Anaphase I -->
  <g transform="translate(340, 100)">
    <ellipse cx="50" cy="60" rx="60" ry="38" class="cell"/>
    <path d="M 15,55 L 35,55" class="chrom-mom"/>
    <path d="M 65,55 L 85,55" class="chrom-dad"/>
    <text x="50" y="135" text-anchor="middle" class="phase-title">Anaphase I</text>
    <text x="50" y="150" text-anchor="middle" class="label">Homologs split apart</text>
    <text x="50" y="165" text-anchor="middle" class="label">(sisters stay together)</text>
  </g>

  <line x1="450" y1="160" x2="485" y2="160" class="arrow" marker-end="url(#m-arr)"/>

  <!-- Telophase I -->
  <g transform="translate(495, 100)">
    <circle cx="30" cy="60" r="28" class="cell"/>
    <path d="M 20,55 L 40,55" class="chrom-mom"/>
    <circle cx="100" cy="60" r="28" class="cell"/>
    <path d="M 90,55 L 110,55" class="chrom-dad"/>
    <text x="65" y="135" text-anchor="middle" class="phase-title">Telophase I</text>
    <text x="65" y="150" text-anchor="middle" class="label">2 cells form</text>
    <text x="65" y="165" text-anchor="middle" class="note">NO interphase next!</text>
  </g>

  <!-- MEIOSIS II label -->
  <rect x="20" y="260" width="680" height="190" rx="10" class="stage-bg"/>
  <text x="40" y="280" class="phase-title">MEIOSIS II — Sister chromatids separate (like a mini-mitosis on each cell)</text>

  <!-- Prophase II -->
  <g transform="translate(40, 310)">
    <circle cx="50" cy="60" r="40" class="cell"/>
    <path d="M 30,45 L 70,75 M 30,75 L 70,45" class="chrom-mom" stroke-width="2"/>
    <text x="50" y="125" text-anchor="middle" class="phase-title">Prophase II</text>
    <text x="50" y="140" text-anchor="middle" class="label">Chroms recondense</text>
  </g>

  <line x1="135" y1="370" x2="170" y2="370" class="arrow" marker-end="url(#m-arr)"/>

  <!-- Metaphase II -->
  <g transform="translate(180, 310)">
    <circle cx="50" cy="60" r="40" class="cell"/>
    <line x1="50" y1="20" x2="50" y2="100" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M 35,55 L 65,55" class="chrom-mom"/>
    <text x="50" y="125" text-anchor="middle" class="phase-title">Metaphase II</text>
    <text x="50" y="140" text-anchor="middle" class="label">Chroms at midline</text>
  </g>

  <line x1="275" y1="370" x2="310" y2="370" class="arrow" marker-end="url(#m-arr)"/>

  <!-- Anaphase II -->
  <g transform="translate(320, 310)">
    <ellipse cx="50" cy="60" rx="55" ry="35" class="cell"/>
    <path d="M 15,55 L 30,55" class="chrom-mom"/>
    <path d="M 70,55 L 85,55" class="chrom-mom"/>
    <text x="50" y="125" text-anchor="middle" class="phase-title">Anaphase II</text>
    <text x="50" y="140" text-anchor="middle" class="label">Sisters split apart</text>
  </g>

  <line x1="430" y1="370" x2="465" y2="370" class="arrow" marker-end="url(#m-arr)"/>

  <!-- Telophase II / 4 cells -->
  <g transform="translate(475, 310)">
    <circle cx="20" cy="40" r="18" class="cell"/>
    <circle cx="60" cy="40" r="18" class="cell"/>
    <circle cx="20" cy="80" r="18" class="cell"/>
    <circle cx="60" cy="80" r="18" class="cell"/>
    <path d="M 14,40 L 26,40" class="chrom-mom"/>
    <path d="M 54,40 L 66,40" class="chrom-dad"/>
    <path d="M 14,80 L 26,80" class="chrom-mom"/>
    <path d="M 54,80 L 66,80" class="chrom-dad"/>
    <text x="40" y="125" text-anchor="middle" class="phase-title">Telophase II</text>
    <text x="40" y="140" text-anchor="middle" class="label">4 haploid (n) cells</text>
    <text x="40" y="155" text-anchor="middle" class="note">All genetically unique!</text>
  </g>
</svg>
