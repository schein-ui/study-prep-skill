<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1f6f3f; }
    .label { font-size: 11.5px; fill: #1c1c1c; }
    .chamber { font-size: 12.5px; font-weight: 700; }
    .vessel { font-size: 10.5px; font-weight: 600; }
    .deox { fill: #5680b3; }
    .ox { fill: #c44a3f; }
    .deox-stroke { stroke: #5680b3; stroke-width: 2; fill: none; }
    .ox-stroke { stroke: #c44a3f; stroke-width: 2; fill: none; }
    .chamber-box { stroke: #444; stroke-width: 1.5; }
    .deox-fill { fill: #cfdbef; }
    .ox-fill { fill: #fbd9d4; }
    .legend-box { stroke: #888; fill: #fdfbf3; }
    .knowforfinal { fill: #fff9e6; stroke: #d4a300; stroke-width: 1.5; }
  </style>
  <text x="380" y="24" text-anchor="middle" class="title">Heart Anatomy &amp; Blood Flow</text>
  <text x="380" y="42" text-anchor="middle" class="label">RIGHT side = deoxygenated (to lungs) · LEFT side = oxygenated (to body)</text>

  <!-- KNOW FOR FINAL banner -->
  <rect x="260" y="50" width="240" height="20" rx="4" class="knowforfinal"/>
  <text x="380" y="65" text-anchor="middle" class="vessel" fill="#8a6800">⚠ Teacher: "KNOW FOR FINAL" — all labels below</text>

  <!-- AORTIC ARCH (top curve) -->
  <path d="M 380,135 Q 380,90 460,90 Q 540,90 540,135" class="ox-stroke" stroke-width="3" fill="none"/>
  <text x="460" y="80" text-anchor="middle" class="vessel ox">Aortic arch</text>

  <!-- Pulmonary trunk -->
  <line x1="350" y1="160" x2="350" y2="120" class="deox-stroke" stroke-width="3"/>
  <text x="290" y="115" text-anchor="end" class="vessel deox">Pulmonary trunk</text>
  <line x1="294" y1="115" x2="335" y2="120" stroke="#5680b3" stroke-width="1"/>

  <!-- Left pulmonary artery -->
  <line x1="350" y1="120" x2="420" y2="105" class="deox-stroke" stroke-width="2.5"/>
  <text x="450" y="105" class="vessel deox">Left pulmonary artery</text>

  <!-- Right pulmonary artery -->
  <line x1="350" y1="120" x2="280" y2="105" class="deox-stroke" stroke-width="2.5"/>
  <text x="270" y="105" text-anchor="end" class="vessel deox">Right pulmonary artery</text>

  <!-- HEART chambers -->
  <!-- right side -->
  <rect x="240" y="160" width="120" height="80" class="chamber-box deox-fill"/>
  <text x="300" y="195" text-anchor="middle" class="chamber deox">Right Atrium</text>
  <text x="300" y="215" text-anchor="middle" class="label">deoxygenated</text>

  <rect x="240" y="250" width="120" height="130" class="chamber-box deox-fill"/>
  <text x="300" y="305" text-anchor="middle" class="chamber deox">Right Ventricle</text>
  <text x="300" y="325" text-anchor="middle" class="label">deoxygenated</text>
  <text x="300" y="345" text-anchor="middle" class="label">(thinner wall)</text>

  <!-- left side -->
  <rect x="380" y="160" width="120" height="80" class="chamber-box ox-fill"/>
  <text x="440" y="195" text-anchor="middle" class="chamber ox">Left Atrium</text>
  <text x="440" y="215" text-anchor="middle" class="label">oxygenated</text>

  <rect x="380" y="250" width="120" height="130" class="chamber-box ox-fill"/>
  <text x="440" y="300" text-anchor="middle" class="chamber ox">Left Ventricle</text>
  <text x="440" y="320" text-anchor="middle" class="label">oxygenated</text>
  <text x="440" y="340" text-anchor="middle" class="label">THICKEST wall</text>
  <text x="440" y="358" text-anchor="middle" class="label">(pumps to body)</text>

  <!-- valves between atria and ventricles -->
  <line x1="245" y1="245" x2="355" y2="245" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="300" y="258" text-anchor="middle" class="vessel" fill="#666">tricuspid valve</text>
  <line x1="385" y1="245" x2="495" y2="245" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="258" text-anchor="middle" class="vessel" fill="#666">bicuspid valve</text>

  <!-- septum -->
  <line x1="370" y1="160" x2="370" y2="380" stroke="#222" stroke-width="3"/>
  <text x="370" y="395" text-anchor="middle" class="vessel" fill="#444">septum</text>

  <!-- vena cavae INTO right atrium -->
  <path d="M 80,180 Q 160,180 240,190" class="deox-stroke"/>
  <text x="78" y="170" text-anchor="start" class="vessel deox">Superior vena cava</text>
  <text x="78" y="183" text-anchor="start" class="label deox">(from upper body)</text>
  <path d="M 80,230 Q 160,230 240,220" class="deox-stroke"/>
  <text x="78" y="245" text-anchor="start" class="vessel deox">Inferior vena cava</text>
  <text x="78" y="258" text-anchor="start" class="label deox">(from lower body)</text>

  <!-- Right pulmonary veins INTO left atrium -->
  <path d="M 560,200 Q 600,210 500,200" class="ox-stroke"/>
  <text x="565" y="195" class="vessel ox">Right pulmonary veins</text>

  <!-- Left pulmonary veins (back side) -->
  <path d="M 560,230 Q 600,240 500,225" class="ox-stroke"/>
  <text x="565" y="225" class="vessel ox">Left pulmonary veins</text>

  <!-- aorta OUT of left ventricle -->
  <path d="M 540,135 Q 600,200 600,300" class="ox-stroke" stroke-width="3"/>
  <polygon points="597,297 603,310 605,297" class="ox"/>
  <text x="610" y="300" class="vessel ox">Aorta</text>
  <text x="610" y="315" class="label ox">(largest artery → BODY)</text>

  <!-- flow order steps -->
  <rect x="40" y="420" width="680" height="90" rx="8" class="legend-box"/>
  <text x="55" y="440" class="label" font-weight="700">Blood flow loop (memorize!):</text>
  <text x="55" y="460" class="label">R atrium → tricuspid → R ventricle → pulm. semilunar valve → pulm. trunk → pulm. arteries → <tspan class="deox" font-weight="700">LUNGS</tspan> (drops CO₂, picks up O₂)</text>
  <text x="55" y="478" class="label">→ pulm. veins → L atrium → bicuspid → L ventricle → aortic SL valve → aorta → <tspan class="ox" font-weight="700">BODY</tspan> (drops O₂, picks up CO₂)</text>
  <text x="55" y="496" class="label">→ vena cavae → back to right atrium. ▶ loop complete</text>
</svg>
